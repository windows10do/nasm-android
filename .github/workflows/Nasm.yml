name: Build NASM Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nasm.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # ------------------------------------------------------------
      # Versions
      # ------------------------------------------------------------
      NASM_VERSION: "3.02"
      NASM_SHA256: "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d"

      NDK_VERSION: "29.0.14206865"
      ANDROID_API: "29"

      AGP_VERSION: "9.3.0"
      GRADLE_VERSION: "9.5.0"

      # ARM64 Android.
      ABI: "arm64-v8a"

    steps:
      # ============================================================
      # 1. Get repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # ============================================================
      # 4. Create COMPLETE Android project
      # ============================================================
      - name: Generate entire Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f README.md

          mkdir -p \
            app/src/main/java/com/rayan/nasm \
            app/src/main/res/values \
            app/src/main/assets \
            app/src/main/jniLibs/${ABI} \
            build/output

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NASM"

          include(":app")
          EOF

          # --------------------------------------------------------
          # Root build.gradle
          # --------------------------------------------------------
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '${AGP_VERSION}' apply false
          }
          EOF

          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rayan.nasm'

              compileSdk 36

              ndkVersion '${NDK_VERSION}'

              defaultConfig {
                  applicationId 'com.rayan.nasm'

                  /*
                   * Android 10 = API 29.
                   */
                  minSdk 29

                  targetSdk 36

                  versionCode 1
                  versionName '${NASM_VERSION}'
              }

              /*
               * NASM is packaged as a native executable in jniLibs.
               * It is NOT loaded with System.loadLibrary().
               */
              sourceSets {
                  main {
                      jniLibs.srcDirs = [
                          'src/main/jniLibs'
                      ]
                  }
              }

              packaging {
                  jniLibs {
                      /*
                       * Extract native libraries from the APK.
                       * This allows the bundled executable to live in
                       * Android's native-library directory.
                       */
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # strings.xml
          # --------------------------------------------------------
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NASM</string>
          </resources>
          EOF

          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # MainActivity.java
          # --------------------------------------------------------
          cat > app/src/main/java/com/rayan/nasm/MainActivity.java <<'EOF'
          package com.rayan.nasm;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private EditText assemblyEditor;
              private EditText argumentsEditor;
              private TextView resultView;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("NASM " + getVersion());
                  title.setTextSize(26);
                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(title);

                  TextView description = new TextView(this);
                  description.setText(
                      "Netwide Assembler for ARM64 Android\n" +
                      "Android 10+"
                  );
                  description.setPadding(0, 12, 0, 12);

                  root.addView(description);

                  TextView argumentsLabel = new TextView(this);
                  argumentsLabel.setText("NASM arguments:");
                  root.addView(argumentsLabel);

                  argumentsEditor = new EditText(this);
                  argumentsEditor.setSingleLine(true);
                  argumentsEditor.setTypeface(Typeface.MONOSPACE);
                  argumentsEditor.setHint(
                      "-f bin source.asm -o output.bin"
                  );

                  root.addView(argumentsEditor);

                  TextView sourceLabel = new TextView(this);
                  sourceLabel.setText("Assembly source:");
                  sourceLabel.setPadding(0, 12, 0, 4);

                  root.addView(sourceLabel);

                  assemblyEditor = new EditText(this);
                  assemblyEditor.setGravity(
                      Gravity.TOP | Gravity.START
                  );
                  assemblyEditor.setTypeface(
                      Typeface.MONOSPACE
                  );
                  assemblyEditor.setMinLines(12);
                  assemblyEditor.setText(
                      "bits 64\n\n" +
                      "mov eax, 1234h\n" +
                      "ret\n"
                  );

                  root.addView(
                      assemblyEditor,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1.0f
                      )
                  );

                  Button assembleButton = new Button(this);
                  assembleButton.setText("Assemble");

                  root.addView(assembleButton);

                  resultView = new TextView(this);
                  resultView.setTypeface(
                      Typeface.MONOSPACE
                  );
                  resultView.setTextIsSelectable(true);
                  resultView.setPadding(
                      0,
                      16,
                      0,
                      16
                  );

                  ScrollView outputScroll = new ScrollView(this);
                  outputScroll.addView(resultView);

                  root.addView(
                      outputScroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          0.8f
                      )
                  );

                  assembleButton.setOnClickListener(
                      new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              assemble();
                          }
                      }
                  );

                  setContentView(root);
              }

              private String getVersion() {
                  return "3.02";
              }

              private void assemble() {
                  resultView.setText(
                      "Starting NASM...\n"
                  );

                  File workingDirectory = new File(
                      getFilesDir(),
                      "nasm-work"
                  );

                  if (!workingDirectory.exists()) {
                      if (!workingDirectory.mkdirs()) {
                          resultView.setText(
                              "Could not create:\n" +
                              workingDirectory
                          );
                          return;
                      }
                  }

                  File sourceFile = new File(
                      workingDirectory,
                      "source.asm"
                  );

                  try {
                      writeText(
                          sourceFile,
                          assemblyEditor
                              .getText()
                              .toString()
                      );

                      File nasmExecutable = new File(
                          getApplicationInfo()
                              .nativeLibraryDir,
                          "libnasm.so"
                      );

                      if (!nasmExecutable.exists()) {
                          resultView.setText(
                              "NASM executable not found.\n\n" +
                              nasmExecutable
                                  .getAbsolutePath()
                          );
                          return;
                      }

                      /*
                       * Default command:
                       *
                       * nasm -f bin source.asm -o output.bin
                       */
                      String args =
                          argumentsEditor
                              .getText()
                              .toString()
                              .trim();

                      ArrayList<String> command =
                          new ArrayList<>();

                      command.add(
                          nasmExecutable
                              .getAbsolutePath()
                      );

                      if (args.length() == 0) {
                          File outputFile = new File(
                              workingDirectory,
                              "output.bin"
                          );

                          command.add("-f");
                          command.add("bin");

                          command.add(
                              sourceFile
                                  .getAbsolutePath()
                          );

                          command.add("-o");
                          command.add(
                              outputFile
                                  .getAbsolutePath()
                          );
                      } else {
                          /*
                           * Basic command-line splitting.
                           */
                          String[] pieces =
                              args.split("\\s+");

                          boolean sourceSpecified =
                              false;

                          for (String piece : pieces) {
                              if (piece.length() == 0) {
                                  continue;
                              }

                              command.add(piece);

                              if (piece.endsWith(".asm")) {
                                  sourceSpecified = true;
                              }
                          }

                          if (!sourceSpecified) {
                              command.add(
                                  sourceFile
                                      .getAbsolutePath()
                              );
                          }
                      }

                      ProcessBuilder processBuilder =
                          new ProcessBuilder(command);

                      processBuilder
                          .directory(workingDirectory);

                      processBuilder
                          .redirectErrorStream(true);

                      Process process =
                          processBuilder.start();

                      ByteArrayOutputStream output =
                          new ByteArrayOutputStream();

                      InputStream input =
                          process.getInputStream();

                      byte[] buffer =
                          new byte[4096];

                      int length;

                      while (
                          (length = input.read(buffer)) != -1
                      ) {
                          output.write(
                              buffer,
                              0,
                              length
                          );
                      }

                      int exitCode =
                          process.waitFor();

                      String outputText =
                          new String(
                              output.toByteArray(),
                              StandardCharsets.UTF_8
                          );

                      StringBuilder result =
                          new StringBuilder();

                      result.append(
                          "Exit code: "
                      );

                      result.append(exitCode);
                      result.append("\n\n");

                      result.append(outputText);

                      result.append(
                          "\n\nWorking directory:\n"
                      );

                      result.append(
                          workingDirectory
                              .getAbsolutePath()
                      );

                      resultView.setText(
                          result.toString()
                      );

                  } catch (Throwable error) {
                      resultView.setText(
                          "NASM execution failed:\n\n" +
                          error.toString()
                      );
                  }
              }

              private void writeText(
                  File file,
                  String text
              ) throws Exception {

                  FileOutputStream output =
                      new FileOutputStream(file);

                  try {
                      output.write(
                          text.getBytes(
                              StandardCharsets.UTF_8
                          )
                      );
                  } finally {
                      output.close();
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Generate README
          # --------------------------------------------------------
          cat > README.md <<'EOF'
          # NASM Android

          NASM 3.02 compiled for ARM64 Android using the Android NDK.

          Minimum Android version: Android 10 / API 29.

          Build output:

              build/output/nasm.apk
          EOF

      # ============================================================
      # 5. Download NASM source
      # ============================================================
      - name: Download NASM 3.02
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --show-error \
            --silent \
            -o "nasm-${NASM_VERSION}.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VERSION}/nasm-${NASM_VERSION}.tar.xz"

          echo "${NASM_SHA256}  nasm-${NASM_VERSION}.tar.xz" \
            | sha256sum -c -

          echo "NASM source archive verified."

      # ============================================================
      # 6. Extract source
      # ============================================================
      - name: Extract NASM
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -xJf \
            "nasm-${NASM_VERSION}.tar.xz"

      # ============================================================
      # 7. Cross compile
      # ============================================================
      - name: Build NASM for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="${TOOLCHAIN}/bin:${PATH}"

          # --------------------------------------------------------
          # Android ARM64 compiler.
          #
          # IMPORTANT:
          # The GitHub runner itself is x86-64.
          # Therefore this binary MUST NOT be executed here.
          # --------------------------------------------------------
          export CC="aarch64-linux-android${ANDROID_API}-clang"
          export CXX="aarch64-linux-android${ANDROID_API}-clang++"

          export AR="llvm-ar"
          export RANLIB="llvm-ranlib"
          export STRIP="llvm-strip"

          # Position independent executable.
          export CFLAGS="-fPIE"
          export LDFLAGS="-pie"

          cd "nasm-${NASM_VERSION}"

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="${GITHUB_WORKSPACE}/nasm-install"

          make -j"$(nproc)"

          make install

          NASM_BIN="${GITHUB_WORKSPACE}/nasm-install/bin/nasm"

          echo "=========================================="
          echo "NASM FILE"
          echo "=========================================="

          file "$NASM_BIN"

          echo "=========================================="
          echo "ELF HEADER"
          echo "=========================================="

          readelf -h "$NASM_BIN"

          echo "=========================================="
          echo "ARCHITECTURE VALIDATION"
          echo "=========================================="

          file "$NASM_BIN" \
            | grep -Ei \
              'ARM aarch64|ARM64|aarch64'

          echo "=========================================="
          echo "PIE / DYNAMIC TYPE"
          echo "=========================================="

          readelf -h "$NASM_BIN" \
            | grep -E \
              'Type:.*DYN'

          echo "=========================================="
          echo "ANDROID ARM64 NASM BUILD SUCCESSFUL"
          echo "=========================================="

          # DO NOT DO THIS:
          #
          # "$NASM_BIN" --version
          #
          # It is an Android ARM64 executable and the GitHub runner
          # is x86-64 Linux. Executing it would produce:
          #
          # Exec format error
          #

      # ============================================================
      # 8. Copy executable into Android native-library packaging
      # ============================================================
      - name: Package NASM executable
        shell: bash
        run: |
          set -euo pipefail

          NASM_BIN="${GITHUB_WORKSPACE}/nasm-install/bin/nasm"

          DEST="app/src/main/jniLibs/${ABI}/libnasm.so"

          cp "$NASM_BIN" "$DEST"

          chmod 0755 "$DEST"

          # Include NASM license.
          cp \
            "nasm-${NASM_VERSION}/LICENSE" \
            "app/src/main/assets/NASM-LICENSE.txt"

          echo "=========================================="
          echo "PACKAGED NATIVE BINARY"
          echo "=========================================="

          file "$DEST"

          ls -lh "$DEST"

      # ============================================================
      # 9. Download Gradle
      # ============================================================
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/gradle"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --show-error \
            --silent \
            -o "$HOME/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "$HOME/gradle.zip" \
            -d "$HOME/gradle"

          echo \
            "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" \
            >> "$GITHUB_PATH"

      # ============================================================
      # 10. Check Gradle
      # ============================================================
      - name: Check build tools
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT}"

          echo "ANDROID_NDK_HOME:"
          echo "${ANDROID_NDK_HOME}"

      # ============================================================
      # 11. Build APK
      # ============================================================
      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # ============================================================
      # 12. Verify APK exists
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

      # ============================================================
      # 13. Create requested output
      # ============================================================
      - name: Create build/output/nasm.apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            build/output/nasm.apk

          test -f build/output/nasm.apk

          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

          echo "Created:"
          echo "build/output/nasm.apk"

          ls -lh \
            build/output/nasm.apk

      # ============================================================
      # 14. Upload artifact
      # ============================================================
      - name: Upload nasm.apk
        uses: actions/upload-artifact@v4
        with:
          name: nasm-apk
          path: build/output/nasm.apk
          if-no-files-found: error