name: Build NASM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NASM_VERSION: "3.02"
  NDK_VERSION: "29.0.14206865"
  ANDROID_API: "29"
  COMPILE_SDK: "35"
  BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.13"
  AGP_VERSION: "8.13.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Java
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Android SDK
      #
      # IMPORTANT:
      # setup-android's automatic license prompt is disabled.
      # Licenses are accepted separately through stdin.
      # ============================================================

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /tmp/sdkmanager-licenses.log 2>&1 || true

          echo "License acceptance finished."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Show Android installation
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo
          echo "Installed NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          echo
          echo "Installed Android platform:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-${COMPILE_SDK}"

      # ============================================================
      # Download NASM
      # ============================================================

      - name: Download NASM source
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VERSION}/nasm-${NASM_VERSION}.tar.xz" \
            -o nasm.tar.xz

          echo "Checking NASM SHA-256..."

          echo "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d  nasm.tar.xz" \
            | sha256sum -c -

          tar -xf nasm.tar.xz

          echo "NASM source extracted."

      # ============================================================
      # Build NASM for Android ARM64
      # ============================================================

      - name: Build NASM for Android ARM64
        shell: bash
        run: |
          set -e

          cd "nasm-${NASM_VERSION}"

          export NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          export CFLAGS="-fPIE"
          export LDFLAGS="-pie"

          mkdir -p "$GITHUB_WORKSPACE/nasm-install"

          echo "Configuring NASM..."

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="$GITHUB_WORKSPACE/nasm-install"

          echo "Building NASM..."

          make -j"$(nproc)"

          echo "Installing NASM into staging directory..."

          make install

          echo
          echo "Target executable:"
          file "$GITHUB_WORKSPACE/nasm-install/bin/nasm"

          echo
          echo "ELF header:"
          readelf -h "$GITHUB_WORKSPACE/nasm-install/bin/nasm" | \
            grep -E "Class:|Machine:|Type:"

          # Do NOT run this binary.
          # It is ARM64 Android code, while the GitHub runner is x86-64.

      # ============================================================
      # Generate Android project
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p \
            app/src/main/java/com/rayan/nasm \
            app/src/main/res/values \
            app/src/main/jniLibs/arm64-v8a

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NASMAndroid"
          include(":app")
          EOF

          # --------------------------------------------------------
          # Root build.gradle
          # --------------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rayan.nasm'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rayan.nasm'
                  minSdk 29
                  targetSdk 29

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # strings.xml
          # --------------------------------------------------------

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <string name="app_name">NASM</string>
          </resources>
          EOF

          # --------------------------------------------------------
          # styles.xml
          # --------------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#444444</item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------------
          # Package NASM binary as an extracted native library
          # --------------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/nasm-install/bin/nasm" \
            app/src/main/jniLibs/arm64-v8a/libnasm.so

          chmod 755 \
            app/src/main/jniLibs/arm64-v8a/libnasm.so

          echo "Packaged NASM:"
          file app/src/main/jniLibs/arm64-v8a/libnasm.so

      # ============================================================
      # MainActivity.java
      # ============================================================

      - name: Generate MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/rayan/nasm/MainActivity.java <<'EOF'
          package com.rayan.nasm;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private static final int PICK_INPUT = 100;
              private static final int PICK_OUTPUT = 101;

              private Uri inputUri;
              private Uri outputUri;

              private TextView inputText;
              private TextView outputText;
              private TextView statusText;
              private EditText arguments;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("NASM");
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);

                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Netwide Assembler for Android\n" +
                      "Android 10+ / ARM64"
                  );
                  info.setGravity(Gravity.CENTER);

                  root.addView(info);

                  Button inputButton = new Button(this);
                  inputButton.setText("Choose ASM input file");

                  root.addView(inputButton);

                  inputText = new TextView(this);
                  inputText.setText("No input file selected");

                  root.addView(inputText);

                  Button outputButton = new Button(this);
                  outputButton.setText("Choose output file");

                  root.addView(outputButton);

                  outputText = new TextView(this);
                  outputText.setText("No output file selected");

                  root.addView(outputText);

                  TextView argsLabel = new TextView(this);
                  argsLabel.setText(
                      "\nNASM arguments:"
                  );

                  root.addView(argsLabel);

                  arguments = new EditText(this);
                  arguments.setSingleLine(false);
                  arguments.setText("-f bin");

                  root.addView(arguments);

                  Button assembleButton = new Button(this);
                  assembleButton.setText("ASSEMBLE");

                  root.addView(assembleButton);

                  statusText = new TextView(this);
                  statusText.setText("\nReady.");

                  root.addView(statusText);

                  inputButton.setOnClickListener(
                      v -> chooseInput()
                  );

                  outputButton.setOnClickListener(
                      v -> chooseOutput()
                  );

                  assembleButton.setOnClickListener(
                      v -> assemble()
                  );

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.addView(root);

                  setContentView(scrollView);
              }

              private void chooseInput() {
                  Intent intent = new Intent(
                      Intent.ACTION_OPEN_DOCUMENT
                  );

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  );

                  intent.setType("*/*");

                  startActivityForResult(
                      intent,
                      PICK_INPUT
                  );
              }

              private void chooseOutput() {
                  Intent intent = new Intent(
                      Intent.ACTION_CREATE_DOCUMENT
                  );

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  );

                  intent.setType(
                      "application/octet-stream"
                  );

                  intent.putExtra(
                      Intent.EXTRA_TITLE,
                      "output.bin"
                  );

                  startActivityForResult(
                      intent,
                      PICK_OUTPUT
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (resultCode != RESULT_OK ||
                      data == null) {
                      return;
                  }

                  if (requestCode == PICK_INPUT) {
                      inputUri = data.getData();

                      if (inputUri != null) {
                          inputText.setText(
                              "Input:\n" +
                              inputUri.toString()
                          );
                      }
                  }

                  if (requestCode == PICK_OUTPUT) {
                      outputUri = data.getData();

                      if (outputUri != null) {
                          outputText.setText(
                              "Output:\n" +
                              outputUri.toString()
                          );
                      }
                  }
              }

              private void assemble() {

                  if (inputUri == null) {
                      statusText.setText(
                          "Choose an ASM input file first."
                      );
                      return;
                  }

                  if (outputUri == null) {
                      statusText.setText(
                          "Choose an output file first."
                      );
                      return;
                  }

                  statusText.setText(
                      "Assembling..."
                  );

                  new Thread(() -> {

                      File inputFile = null;
                      File outputFile = null;

                      try {

                          inputFile = new File(
                              getCacheDir(),
                              "nasm_input.asm"
                          );

                          outputFile = new File(
                              getCacheDir(),
                              "nasm_output.tmp"
                          );

                          copyUriToFile(
                              inputUri,
                              inputFile
                          );

                          if (outputFile.exists()) {
                              outputFile.delete();
                          }

                          String nasmPath =
                              getApplicationInfo()
                                  .nativeLibraryDir
                                  + "/libnasm.so";

                          String argText =
                              arguments
                                  .getText()
                                  .toString()
                                  .trim();

                          ArrayList<String> command =
                              new ArrayList<>();

                          command.add(nasmPath);

                          if (!argText.isEmpty()) {

                              String[] extraArgs =
                                  argText.split("\\s+");

                              for (String arg : extraArgs) {

                                  if (!arg.isEmpty()) {
                                      command.add(arg);
                                  }
                              }
                          }

                          command.add(
                              inputFile.getAbsolutePath()
                          );

                          command.add("-o");

                          command.add(
                              outputFile.getAbsolutePath()
                          );

                          ProcessBuilder processBuilder =
                              new ProcessBuilder(command);

                          processBuilder
                              .redirectErrorStream(true);

                          Process process =
                              processBuilder.start();

                          InputStream processInput =
                              process.getInputStream();

                          ByteArrayOutputStream log =
                              new ByteArrayOutputStream();

                          byte[] buffer =
                              new byte[4096];

                          int count;

                          while ((count =
                              processInput.read(buffer)) != -1) {

                              log.write(
                                  buffer,
                                  0,
                                  count
                              );
                          }

                          int exitCode =
                              process.waitFor();

                          String logText =
                              log.toString("UTF-8");

                          if (exitCode != 0) {

                              final String message =
                                  "NASM failed (" +
                                  exitCode +
                                  ")\n\n" +
                                  logText;

                              runOnUiThread(
                                  () -> statusText.setText(
                                      message
                                  )
                              );

                              return;
                          }

                          if (!outputFile.exists()) {

                              runOnUiThread(
                                  () -> statusText.setText(
                                      "NASM finished, but " +
                                      "no output file was created."
                                  )
                              );

                              return;
                          }

                          copyFileToUri(
                              outputFile,
                              outputUri
                          );

                          runOnUiThread(
                              () -> statusText.setText(
                                  "Assembly successful!\n\n" +
                                  "Output saved to the file " +
                                  "you selected."
                              )
                          );

                      } catch (Exception e) {

                          final String message =
                              "Error:\n" +
                              e.toString();

                          runOnUiThread(
                              () -> statusText.setText(
                                  message
                              )
                          );

                      } finally {

                          if (inputFile != null) {
                              inputFile.delete();
                          }

                          if (outputFile != null) {
                              outputFile.delete();
                          }
                      }

                  }).start();
              }

              private void copyUriToFile(
                      Uri uri,
                      File destination) throws Exception {

                  InputStream in =
                      getContentResolver()
                          .openInputStream(uri);

                  if (in == null) {
                      throw new Exception(
                          "Unable to open input file."
                      );
                  }

                  FileOutputStream out =
                      new FileOutputStream(destination);

                  byte[] buffer =
                      new byte[8192];

                  int count;

                  while ((count =
                      in.read(buffer)) != -1) {

                      out.write(
                          buffer,
                          0,
                          count
                      );
                  }

                  out.close();
                  in.close();
              }

              private void copyFileToUri(
                      File source,
                      Uri uri) throws Exception {

                  InputStream in =
                      new FileInputStream(source);

                  OutputStream out =
                      getContentResolver()
                          .openOutputStream(uri);

                  if (out == null) {
                      throw new Exception(
                          "Unable to open selected output file."
                      );
                  }

                  byte[] buffer =
                      new byte[8192];

                  int count;

                  while ((count =
                      in.read(buffer)) != -1) {

                      out.write(
                          buffer,
                          0,
                          count
                      );
                  }

                  out.flush();
                  out.close();
                  in.close();
              }
          }
          EOF

      # ============================================================
      # Gradle
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper \
            --gradle-version="${GRADLE_VERSION}"

      # ============================================================
      # Build APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # Put APK in repository output/
      # ============================================================

      - name: Copy APK to output/
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/nasm.apk

          echo
          echo "=========================================="
          echo "NASM APK:"
          echo "=========================================="

          ls -lh output/nasm.apk

          echo
          echo "APK SHA-256:"
          sha256sum output/nasm.apk

      # ============================================================
      # Verify
      # ============================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          test -f output/nasm.apk

          echo "Final repository file:"
          file output/nasm.apk

      # ============================================================
      # Commit output/nasm.apk
      # ============================================================

      - name: Commit APK to repository
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/nasm.apk

          if git diff --cached --quiet; then
              echo "output/nasm.apk is already up to date."
          else
              git commit -m "Build NASM Android APK"
              git push
          fi