name: Build NASM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NASM_VERSION: "3.02"
  NDK_VERSION: "29.0.14206865"
  ANDROID_API: "29"
  COMPILE_SDK: "35"
  BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.13"
  AGP_VERSION: "8.13.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # Android SDK / NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Show tool versions
        run: |
          java -version
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      # ------------------------------------------------------------
      # Download NASM source
      # ------------------------------------------------------------
      - name: Download NASM
        run: |
          curl -L \
            "https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VERSION}/nasm-${NASM_VERSION}.tar.xz" \
            -o nasm.tar.xz

          echo "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d  nasm.tar.xz" \
            | sha256sum -c -

          tar -xf nasm.tar.xz

      # ------------------------------------------------------------
      # Cross compile NASM for Android ARM64
      # ------------------------------------------------------------
      - name: Build NASM for Android ARM64
        shell: bash
        run: |
          set -e

          cd "nasm-${NASM_VERSION}"

          export NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          export CFLAGS="-fPIE"
          export LDFLAGS="-pie"

          mkdir -p "$GITHUB_WORKSPACE/nasm-install"

          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host=aarch64-linux-android \
            --prefix="$GITHUB_WORKSPACE/nasm-install"

          make -j"$(nproc)"
          make install

          echo "NASM target binary:"
          file "$GITHUB_WORKSPACE/nasm-install/bin/nasm"

          echo "ELF information:"
          readelf -h "$GITHUB_WORKSPACE/nasm-install/bin/nasm" | grep -E \
            "Class:|Machine:|Type:"

          # IMPORTANT:
          # Do NOT execute this binary here.
          # It is an Android ARM64 executable and the GitHub runner is x86-64.

      # ------------------------------------------------------------
      # Generate Android project
      # ------------------------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p \
            app/src/main/java/com/rayan/nasm \
            app/src/main/res/values \
            app/src/main/jniLibs/arm64-v8a \
            gradle/wrapper

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NASMAndroid"
          include(":app")
          EOF

          # --------------------------------------------------------
          # Root build.gradle
          # --------------------------------------------------------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------------------------
          # App build.gradle
          # --------------------------------------------------------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rayan.nasm'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rayan.nasm'
                  minSdk 29
                  targetSdk 29
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:extractNativeLibs="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # Strings
          # --------------------------------------------------------
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NASM</string>
          </resources>
          EOF

          # --------------------------------------------------------
          # Theme
          # --------------------------------------------------------
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#444444</item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------------
          # Copy ARM64 NASM executable
          #
          # It is intentionally named libnasm.so so Android packages
          # it as a native library and extracts it.
          # --------------------------------------------------------
          cp \
            "$GITHUB_WORKSPACE/nasm-install/bin/nasm" \
            app/src/main/jniLibs/arm64-v8a/libnasm.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libnasm.so

          file app/src/main/jniLibs/arm64-v8a/libnasm.so

      # ------------------------------------------------------------
      # MainActivity
      # ------------------------------------------------------------
      - name: Generate NASM Android app
        shell: bash
        run: |
          cat > app/src/main/java/com/rayan/nasm/MainActivity.java <<'EOF'
          package com.rayan.nasm;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final int PICK_INPUT = 100;
              private static final int PICK_OUTPUT = 101;

              private Uri inputUri = null;
              private Uri outputUri = null;

              private TextView inputText;
              private TextView outputText;
              private TextView statusText;
              private EditText arguments;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("NASM");
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Netwide Assembler for Android\\n" +
                      "Android 10+ / ARM64"
                  );
                  info.setGravity(Gravity.CENTER);
                  root.addView(info);

                  Button inputButton = new Button(this);
                  inputButton.setText("Choose ASM input file");
                  root.addView(inputButton);

                  inputText = new TextView(this);
                  inputText.setText("No input file selected");
                  root.addView(inputText);

                  Button outputButton = new Button(this);
                  outputButton.setText("Choose output file");
                  root.addView(outputButton);

                  outputText = new TextView(this);
                  outputText.setText("No output file selected");
                  root.addView(outputText);

                  TextView argsLabel = new TextView(this);
                  argsLabel.setText(
                      "\\nNASM arguments (input/output are added automatically):"
                  );
                  root.addView(argsLabel);

                  arguments = new EditText(this);
                  arguments.setSingleLine(false);
                  arguments.setText("-f bin");
                  root.addView(arguments);

                  Button assembleButton = new Button(this);
                  assembleButton.setText("ASSEMBLE");
                  root.addView(assembleButton);

                  statusText = new TextView(this);
                  statusText.setText("\\nReady.");
                  root.addView(statusText);

                  inputButton.setOnClickListener(v -> chooseInput());
                  outputButton.setOnClickListener(v -> chooseOutput());

                  assembleButton.setOnClickListener(v -> assemble());

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              private void chooseInput() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  startActivityForResult(intent, PICK_INPUT);
              }

              private void chooseOutput() {
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/octet-stream");
                  intent.putExtra(Intent.EXTRA_TITLE, "output.bin");
                  startActivityForResult(intent, PICK_OUTPUT);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (resultCode != RESULT_OK || data == null) {
                      return;
                  }

                  if (requestCode == PICK_INPUT) {
                      inputUri = data.getData();

                      if (inputUri != null) {
                          inputText.setText(
                              "Input:\\n" + inputUri.toString()
                          );
                      }
                  }

                  if (requestCode == PICK_OUTPUT) {
                      outputUri = data.getData();

                      if (outputUri != null) {
                          outputText.setText(
                              "Output:\\n" + outputUri.toString()
                          );
                      }
                  }
              }

              private void assemble() {

                  if (inputUri == null) {
                      statusText.setText("Choose an ASM input file first.");
                      return;
                  }

                  if (outputUri == null) {
                      statusText.setText("Choose an output file first.");
                      return;
                  }

                  statusText.setText("Assembling...");

                  new Thread(() -> {

                      File inputFile = null;
                      File outputFile = null;

                      try {

                          inputFile = new File(
                              getCacheDir(),
                              "nasm_input.asm"
                          );

                          outputFile = new File(
                              getCacheDir(),
                              "nasm_output.tmp"
                          );

                          copyUriToFile(inputUri, inputFile);

                          if (outputFile.exists()) {
                              outputFile.delete();
                          }

                          String nasmPath =
                              getApplicationInfo().nativeLibraryDir
                              + "/libnasm.so";

                          String argText =
                              arguments.getText().toString().trim();

                          java.util.ArrayList<String> command =
                              new java.util.ArrayList<>();

                          command.add(nasmPath);

                          if (!argText.isEmpty()) {
                              String[] extraArgs =
                                  argText.split("\\\\s+");

                              for (String arg : extraArgs) {
                                  if (!arg.isEmpty()) {
                                      command.add(arg);
                                  }
                              }
                          }

                          command.add(inputFile.getAbsolutePath());
                          command.add("-o");
                          command.add(outputFile.getAbsolutePath());

                          ProcessBuilder pb =
                              new ProcessBuilder(command);

                          pb.redirectErrorStream(true);

                          Process process = pb.start();

                          InputStream processOutput =
                              process.getInputStream();

                          java.io.ByteArrayOutputStream log =
                              new java.io.ByteArrayOutputStream();

                          byte[] buffer = new byte[4096];
                          int count;

                          while ((count =
                              processOutput.read(buffer)) != -1) {

                              log.write(buffer, 0, count);
                          }

                          int exitCode = process.waitFor();

                          String logText =
                              log.toString("UTF-8");

                          if (exitCode != 0) {

                              final String message =
                                  "NASM failed (" +
                                  exitCode +
                                  ")\\n\\n" +
                                  logText;

                              runOnUiThread(() ->
                                  statusText.setText(message)
                              );

                              return;
                          }

                          if (!outputFile.exists()) {

                              runOnUiThread(() ->
                                  statusText.setText(
                                      "NASM finished, but no output file was created."
                                  )
                              );

                              return;
                          }

                          copyFileToUri(
                              outputFile,
                              outputUri
                          );

                          final String message =
                              "Assembly successful!\\n\\n" +
                              "Output was saved to the file you selected.";

                          runOnUiThread(() ->
                              statusText.setText(message)
                          );

                      } catch (Exception e) {

                          final String message =
                              "Error:\\n" +
                              e.toString();

                          runOnUiThread(() ->
                              statusText.setText(message)
                          );

                      } finally {

                          if (inputFile != null) {
                              inputFile.delete();
                          }

                          if (outputFile != null) {
                              outputFile.delete();
                          }
                      }

                  }).start();
              }

              private void copyUriToFile(
                      Uri uri,
                      File destination) throws Exception {

                  InputStream in =
                      getContentResolver().openInputStream(uri);

                  if (in == null) {
                      throw new Exception(
                          "Unable to open input file."
                      );
                  }

                  FileOutputStream out =
                      new FileOutputStream(destination);

                  byte[] buffer = new byte[8192];
                  int count;

                  while ((count = in.read(buffer)) != -1) {
                      out.write(buffer, 0, count);
                  }

                  out.close();
                  in.close();
              }

              private void copyFileToUri(
                      File source,
                      Uri uri) throws Exception {

                  InputStream in =
                      new FileInputStream(source);

                  OutputStream out =
                      getContentResolver().openOutputStream(uri);

                  if (out == null) {
                      throw new Exception(
                          "Unable to open selected output file."
                      );
                  }

                  byte[] buffer = new byte[8192];
                  int count;

                  while ((count = in.read(buffer)) != -1) {
                      out.write(buffer, 0, count);
                  }

                  out.flush();
                  out.close();
                  in.close();
              }
          }
          EOF

      # ------------------------------------------------------------
      # Gradle wrapper
      # ------------------------------------------------------------
      - name: Install Gradle
        run: |
          curl -L \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o gradle.zip

          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"

          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" \
            >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version="${GRADLE_VERSION}"

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ------------------------------------------------------------
      # Put APK directly in repository output/
      # ------------------------------------------------------------
      - name: Copy APK to output/
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/nasm.apk

          echo "======================================"
          echo "APK created:"
          ls -lh output/nasm.apk
          echo "======================================"

      # ------------------------------------------------------------
      # Verify APK exists
      # ------------------------------------------------------------
      - name: Verify final output
        run: |
          test -f output/nasm.apk
          file output/nasm.apk
          du -h output/nasm.apk

      # ------------------------------------------------------------
      # Commit output/nasm.apk back into repository
      # ------------------------------------------------------------
      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/nasm.apk

          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build NASM Android APK"
            git push
          fi